<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<meta name="description" content="Marka Istanbul Köln – yetkili Zen Diamond bayisi. Tektaş, alyans, baget ve pırlanta koleksiyonları; 22 ayar bilezik, ziynet ve Reşat altın güncel kurla.">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Marka Istanbul – Zen Diamond Köln</title>
<link href="f.css" rel="stylesheet">
<style>
:root{
  --paper:#f6f5f2; --surface:#ffffff; --ink:#0d0d0d; --text:#0d0d0d; --soft:#6f6a60; --rule:#e2dfd7;
  --gold:#a8873a; --red:#d8232a; --band:#0d0d0d; --field:#ffffff;
  --metal:linear-gradient(120deg,#8a6a1f 0%,#e2c878 42%,#b08d3c 68%,#7a5a17 100%);
  --disp:"Cormorant Garamond","Times New Roman",serif; --body:"Jost",system-ui,sans-serif;
  --w:1240px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--band);scroll-behavior:smooth}
body{font-family:var(--body);font-weight:300;font-size:16px;line-height:1.55;background:var(--paper);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:var(--w);margin:0 auto;padding:0 22px}
h1,h2,h3{font-family:var(--disp);font-weight:400;letter-spacing:-.01em}

.rate{background:var(--band);color:#e9e3d2;font-size:13px;letter-spacing:.02em;padding:calc(7px + env(safe-area-inset-top)) 16px 7px;text-align:center}
.rate b{font-weight:500;color:#e2c878;margin:0 6px 0 4px}
.rate i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#3fae76;margin-right:8px;vertical-align:1px}
.rate i.off{background:#c9a647}

.top{position:sticky;top:0;z-index:30;background:#f6f5f2;border-bottom:1px solid #e2dfd7}
.top .wrap{display:flex;align-items:center;gap:18px;height:68px}
.top .logo{height:40px;width:auto}
.top nav{display:none;gap:30px;margin:0 auto;font-size:15px;font-weight:400;color:#0d0d0d}
.top nav a{padding:6px 0;border-bottom:1px solid transparent}
.top nav a:hover{border-bottom-color:var(--gold)}
.top .r{margin-left:auto;display:flex;align-items:center;gap:14px;color:#0d0d0d}
.lang{display:flex;gap:2px;font-size:13px}
.lang button{padding:5px 6px;color:#8a857b;font-weight:400}
.lang button.on{color:#0d0d0d;border-bottom:1px solid var(--gold)}
.bag{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:400;border:1px solid #0d0d0d;padding:8px 14px}
.bag span.n{font-weight:500;color:var(--gold)}
@media(min-width:940px){.top nav{display:flex}.top .r{margin-left:0}.top .logo{height:46px}}

.hero{display:grid;grid-template-columns:1fr}
.hero .pic{position:relative;min-height:58vw;background:#eceae5}
.hero .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .txt{padding:38px 22px 46px;display:flex;flex-direction:column;justify-content:center}
.hero h1{font-size:clamp(42px,6.4vw,84px);line-height:.98}
.hero h1 em{font-style:italic}
.hero p{font-size:18px;max-width:30em;margin-top:22px;color:var(--soft)}
.acts{display:flex;flex-wrap:wrap;gap:14px 26px;align-items:center;margin-top:30px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:#f6f5f2;padding:15px 26px;font-size:15px;font-weight:400;letter-spacing:.03em}
.btn.wa{background:#1d9a50;color:#fff}
.btn.full{width:100%}
.link{font-size:15px;font-weight:400;border-bottom:1px solid var(--gold);padding-bottom:3px}
@media(min-width:940px){
  .hero{grid-template-columns:minmax(0,1.02fr) minmax(0,1fr);min-height:min(78vh,760px)}
  .hero .pic{order:2;min-height:0}
  .hero .txt{padding:60px 56px 60px max(22px,calc((100vw - var(--w))/2 + 22px))}
}

.dealer{background:var(--herobg,#f4f5f4);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.dealer .wrap{display:grid;grid-template-columns:1fr;align-items:center;padding:0}
.dealer img{width:100%}
.dealer div.t{padding:26px 22px 34px}
.dealer h2{font-size:clamp(28px,3.6vw,44px);line-height:1.05}
.dealer p{color:var(--soft);margin-top:12px;max-width:34em}
@media(min-width:940px){.dealer .wrap{grid-template-columns:1.25fr 1fr;padding:0 22px}.dealer div.t{padding:30px 0 30px 54px}}

section{padding:74px 0 0;scroll-margin-top:80px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 30px;margin-bottom:28px}
.head h2{font-size:clamp(34px,4.6vw,60px);line-height:1}
.head p{color:var(--soft);max-width:30em}

.mosaic{display:grid;grid-template-columns:repeat(2,1fr);gap:26px 14px}
.tile{display:flex;flex-direction:column;scroll-margin-top:90px}
.tile .im{background:#eceae5;overflow:hidden;aspect-ratio:4/3}
.tile .im img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
.tile:hover .im img{transform:scale(1.03)}
.tile h3{font-size:26px;line-height:1.1;margin-top:14px}
.tile p{color:var(--soft);font-size:15px;margin-top:4px}
.go{margin-top:10px;align-self:flex-start;font-size:15px;font-weight:400;border-bottom:1px solid var(--gold);padding-bottom:2px;text-align:left}
.tile.big,.tile.mid{grid-column:1/-1}
.tile.big .im,.tile.mid .im{aspect-ratio:16/10}
.tile.big h3,.tile.mid h3{font-size:34px}
@media(min-width:940px){
  .mosaic{grid-template-columns:repeat(12,1fr);gap:44px 22px}
  .tile{grid-column:span 3}
  .tile.big{grid-column:span 7}.tile.mid{grid-column:span 5}
  .tile.big .im,.tile.mid .im{aspect-ratio:auto;height:440px}
  .tile.big h3,.tile.mid h3{font-size:36px}
}
@media(prefers-reduced-motion:reduce){.tile .im img{transition:none}html{scroll-behavior:auto}}

.story{margin-top:84px;background:#0d0d0d;color:#efe9da;position:relative;overflow:hidden}
.story>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:right center}
.story::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(13,13,13,.94) 0%,rgba(13,13,13,.8) 46%,rgba(13,13,13,.1) 82%)}
.story .wrap{position:relative;z-index:2;padding-top:74px;padding-bottom:74px}
.story .in{max-width:560px}
.story h2{font-size:clamp(34px,4.4vw,56px);line-height:1.02}
.story p{margin-top:16px;color:#cfc8b6}
.story ul{list-style:none;margin-top:26px;border-top:1px solid rgba(226,200,120,.35)}
.story li{padding:13px 0;border-bottom:1px solid rgba(226,200,120,.35);font-weight:400}
.story li span{display:block;font-weight:300;color:#b9b19d;font-size:15px}
@media(max-width:700px){.story::before{background:rgba(13,13,13,.82)}}

.board{display:grid;grid-template-columns:1fr;gap:34px 54px}
@media(min-width:940px){.board{grid-template-columns:1fr 1fr}}
.col h3{font-size:28px;padding-bottom:12px;border-bottom:1px solid var(--ink)}
.row{display:grid;grid-template-columns:48px 1fr auto 40px;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--rule)}
.row .c{width:48px;height:48px;display:flex;align-items:center;justify-content:center}
.row .c img{object-fit:contain;filter:drop-shadow(0 3px 4px rgba(60,40,0,.22))}
.row .nm{font-weight:400;font-size:17px}
.row .nm small{display:block;font-weight:300;color:var(--soft);font-size:13.5px}
.row .pr{font-family:var(--disp);font-size:28px;font-variant-numeric:tabular-nums lining-nums;white-space:nowrap}
.plus{width:38px;height:38px;border:1px solid var(--ink);font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center}
.plus:hover{background:var(--ink);color:var(--paper)}
.fine{color:var(--soft);font-size:14px;margin-top:16px;max-width:46em}

.bz{display:grid;grid-template-columns:1fr;gap:16px;margin-top:44px;scroll-margin-top:90px}
@media(min-width:940px){.bz{grid-template-columns:1fr 1fr;gap:22px}}
.bcard{background:var(--surface);border:1px solid var(--rule);display:grid;grid-template-columns:110px 1fr;gap:16px;padding:16px;align-items:center}
.bcard .im{background:radial-gradient(circle at 50% 42%,#fffdf6,#f3e9c9);aspect-ratio:1/1;display:flex;align-items:center;justify-content:center}
.bcard .im img{width:82%;filter:drop-shadow(0 5px 7px rgba(60,40,0,.25))}
.bcard h3{font-size:28px;line-height:1}
.bcard .per{color:var(--soft);font-size:14.5px;margin-top:2px}
.calc{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.calc input{width:72px;border:1px solid var(--ink);padding:9px 8px;font:inherit;font-weight:400;text-align:center;background:var(--field);color:var(--text);border-radius:0}
.calc .sum{font-family:var(--disp);font-size:28px;font-variant-numeric:tabular-nums lining-nums;margin-left:auto;white-space:nowrap}
.bcard .btn{margin-top:12px;padding:11px 16px;font-size:14px}
.gset{position:relative;min-height:230px;background:#eceae5;overflow:hidden;display:flex;align-items:flex-end}
.gset>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gset div{position:relative;background:var(--gsetbg,#f6f5f2);padding:14px 18px;margin:14px;max-width:300px}
.gset h3{font-size:26px;line-height:1.05}
.gset p{color:var(--soft);font-size:15px;margin-top:4px}

#takiH .x{background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent;font-style:italic;padding:0 .08em}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -22px 22px;padding:0 22px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{white-space:nowrap;border:1px solid var(--rule);padding:9px 16px;font-size:15px;font-weight:400;background:var(--surface)}
.chips button small{color:var(--soft);font-weight:300;margin-left:6px;font-size:13px}
.chips button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chips button.on small{color:inherit;opacity:.7}
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:26px 14px}
@media(min-width:700px){.pgrid{grid-template-columns:repeat(3,1fr);gap:34px 22px}}
@media(min-width:1000px){.pgrid{grid-template-columns:repeat(4,1fr)}}
.pc{display:flex;flex-direction:column}
.pc .im{aspect-ratio:1/1;background:#fff;overflow:hidden;border:1px solid var(--rule)}
.pc .im img{width:100%;height:100%;object-fit:cover}
.pc h3{font-family:var(--body);font-weight:400;font-size:15.5px;line-height:1.3;letter-spacing:0;margin-top:10px}
.pc .sku{color:var(--soft);font-size:13px}
.pc .pp{font-family:var(--disp);font-size:26px;font-variant-numeric:tabular-nums lining-nums;margin-top:auto;padding-top:4px}
.pc .go{margin-top:6px}
.more{display:flex;justify-content:center;margin-top:34px}
.more .btn{background:transparent;color:var(--text);border:1px solid var(--ink)}
html.koyu .more .btn{background:transparent;color:var(--text)}

.promise{display:grid;grid-template-columns:1fr;border-top:1px solid var(--ink)}
.promise div{padding:20px 0;border-bottom:1px solid var(--rule)}
@media(min-width:800px){.promise{grid-template-columns:repeat(4,1fr)}.promise div{padding:22px 22px 6px 0;border-bottom:0}.promise div+div{padding-left:22px;border-left:1px solid var(--rule)}}
.promise h3{font-size:24px;line-height:1.1}
.promise p{color:var(--soft);font-size:15px;margin-top:6px}

.store{display:grid;grid-template-columns:1fr;gap:26px;padding:34px 0 0;border-top:1px solid var(--ink)}
@media(min-width:900px){.store{grid-template-columns:1.1fr 1fr 1fr;gap:54px}}
.store h2{font-size:clamp(34px,4.4vw,56px);line-height:1}
.store dl{display:grid;gap:14px}
.store dt{font-size:13.5px;color:var(--soft)}
.store dd{font-weight:400;font-size:17px}
.store .acts{margin-top:0;flex-direction:column;align-items:stretch;gap:10px}
.store .btn.line{background:transparent;color:var(--text);border:1px solid var(--ink)}
footer{margin-top:74px;background:#0d0d0d;color:#a9a393;font-size:14px;padding:34px 0 calc(40px + env(safe-area-inset-bottom))}
footer .wrap{display:grid;gap:14px}
footer img{height:44px;width:auto;background:#f6f5f2;padding:6px 12px;justify-self:start}
footer a{color:#e2c878;border-bottom:1px solid rgba(226,200,120,.4)}

.ovl{position:fixed;inset:0;background:rgba(13,13,13,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.ovl.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(460px,100%);background:var(--drawer,#f6f5f2);color:var(--text);z-index:41;transform:translateX(102%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.on{transform:none;box-shadow:-14px 0 50px rgba(0,0,0,.25)}
.dh{display:flex;align-items:center;padding:calc(18px + env(safe-area-inset-top)) 22px 16px;border-bottom:1px solid var(--ink)}
.dh h2{font-size:32px;margin-right:auto;line-height:1}
.dh button{font-size:24px;padding:2px 6px}
.dbody{flex:1;overflow-y:auto;padding:6px 22px 18px}
.ci{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--rule)}
.ci .im{width:56px;height:56px;background:#efece4;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ci .im img{max-width:44px;max-height:44px;object-fit:contain}
.ci .im img.ph{max-width:none;max-height:none;width:100%;height:100%;object-fit:cover}
.ci .n{font-weight:400}
.ci .s{color:var(--soft);font-size:14px}
.ci .v{font-family:var(--disp);font-size:22px;text-align:right;font-variant-numeric:tabular-nums lining-nums;white-space:nowrap}
.ci .v.ask{font-family:var(--body);font-size:13.5px;color:var(--soft);white-space:normal;max-width:90px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--rule);margin-top:6px;background:var(--field)}
.qty button{width:30px;height:28px;font-size:17px}
.qty span{min-width:22px;text-align:center;font-weight:400;font-size:14.5px}
.empty{color:var(--soft);padding:44px 0;font-size:17px}
.form{margin-top:20px;display:grid;gap:16px}
.form .lb{font-size:14px;color:var(--soft);display:block;margin-bottom:6px}
.form input[type=text],.form textarea{width:100%;border:1px solid var(--ink);padding:12px;font:inherit;font-weight:400;background:var(--field);color:var(--text);border-radius:0}
.form textarea{min-height:64px;resize:vertical}
.opt{display:grid;border:1px solid var(--rule);background:var(--field)}
.opt label{display:flex;align-items:center;gap:10px;padding:11px 12px;cursor:pointer;font-weight:400;font-size:15.5px}
.opt label+label{border-top:1px solid var(--rule)}
.opt input{accent-color:#0d0d0d;width:17px;height:17px}
.opt label.dis{color:var(--soft);cursor:default;font-weight:300}
.dfoot{border-top:1px solid var(--ink);padding:14px 22px calc(16px + env(safe-area-inset-bottom));background:var(--dfoot,#fff)}
.tot{display:flex;justify-content:space-between;align-items:baseline}
.tot span{font-size:15px}
.tot b{font-family:var(--disp);font-weight:500;font-size:34px;font-variant-numeric:tabular-nums lining-nums}
.note{color:var(--soft);font-size:13.5px;line-height:1.4;margin:2px 0 12px}
.err{color:var(--red);font-size:14.5px;margin-bottom:10px;display:none;font-weight:400}
.err.on{display:block}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,30px);background:#0d0d0d;color:#f6f5f2;padding:12px 20px;font-size:14.5px;opacity:0;transition:all .25s;z-index:60;pointer-events:none;white-space:nowrap;border-bottom:2px solid #c9a647}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* koyu konseptler – üst logo şeridi açık kalır, Zen logosu değişmez */
html.koyu{--paper:var(--tbg,#111112);--surface:rgba(255,255,255,.05);--text:#f1ead8;--ink:#e2c878;--soft:#b3aa93;--rule:rgba(226,200,120,.26);--herobg:var(--tbg2,#0b0b0c);--field:rgba(0,0,0,.35);--drawer:#151516;--dfoot:#0e0e0f;--gsetbg:#151516;color-scheme:dark}
html.koyu .btn{background:var(--metal);color:#0d0d0d}
html.koyu .btn.wa{background:#1d9a50;color:#fff}
html.koyu .store .btn.line{background:transparent;color:var(--text)}
html.koyu .plus:hover{color:#0d0d0d}
html.koyu .opt input{accent-color:#e2c878}
</style>
</head>
<body>

<div class="rate"><i class="off" id="dot"></i><span id="spotLbl"></span><b id="spotG">—</b><span id="spotWhen"></span></div>

<header class="top">
  <div class="wrap">
    <a href="#ust"><img class="logo" src="lockup.png" alt="Zen Diamond × Marka Istanbul"></a>
    <nav>
      <a href="#pirlanta" data-t="nPir"></a><a href="#alyans" data-t="nAly"></a><a href="#altin" data-t="nAlt"></a><a href="#bilezik" data-t="nBil"></a><a href="#taki" data-t="nTak"></a><a href="#magaza" data-t="nMag"></a>
    </nav>
    <div class="r">
      <div class="lang" id="lang"><button data-l="tr">TR</button><button data-l="de">DE</button><button data-l="en">EN</button></div>
      <button class="bag" id="cartBtn"><span data-t="cart"></span><span class="n" id="cartN">0</span></button>
    </div>
  </div>
</header>

<div class="hero" id="ust">
  <div class="pic"><img src="g-hero.jpg" alt=""></div>
  <div class="txt">
    <h1 data-h="heroH"></h1>
    <p data-t="heroP"></p>
    <div class="acts"><a class="btn" href="#pirlanta" data-t="heroA"></a><a class="link" id="waHero" target="_blank" rel="noopener" data-t="heroB"></a></div>
  </div>
</div>

<div class="dealer">
  <div class="wrap">
    <img id="kapak" src="kapak-beyaz.jpg" alt="Zen Diamond × Marka Istanbul">
    <div class="t"><h2 data-t="dealH"></h2><p data-t="dealP"></p></div>
  </div>
</div>

<main>
  <section id="pirlanta"><div class="wrap">
    <div class="head"><h2 data-t="pirH"></h2><p data-t="pirP"></p></div>
    <div class="mosaic" id="mosaic"></div>
  </div></section>

  <div class="story">
    <img src="g-atolye.jpg" alt="" loading="lazy">
    <div class="wrap"><div class="in">
      <h2 data-t="stH"></h2><p data-t="stP"></p>
      <ul id="stL"></ul>
    </div></div>
  </div>

  <section id="altin"><div class="wrap">
    <div class="head"><h2 data-t="altH"></h2><p data-t="altP"></p></div>
    <div class="board"><div class="col"><h3 data-t="zH"></h3><div id="lZ"></div></div><div class="col"><h3 data-t="rH"></h3><div id="lR"></div></div></div>
    <p class="fine" data-t="altF"></p>
    <div class="bz" id="bilezik"></div>
  </div></section>

  <section id="taki"><div class="wrap">
    <div class="head"><h2 id="takiH"></h2><p id="takiP"></p></div>
    <div class="chips" id="takiChips"></div>
    <div id="taki4"></div>
    <div class="more" id="takiMore"></div>
  </div></section>

  <section><div class="wrap"><div class="promise" id="promise"></div></div></section>

  <section id="magaza"><div class="wrap">
    <div class="store">
      <h2 data-t="magH"></h2>
      <dl>
        <div><dt data-t="mAdr"></dt><dd>Keupstraße 52-54<br>51063 Köln</dd></div>
        <div><dt data-t="mSaat"></dt><dd data-t="hours"></dd></div>
        <div><dt data-t="mTel"></dt><dd><a href="tel:+4922180039255">0221 80039255</a></dd></div>
      </dl>
      <div class="acts">
        <a class="btn wa" id="waShop" target="_blank" rel="noopener" data-t="waWrite"></a>
        <a class="btn line" href="https://www.google.com/maps/search/?api=1&query=Keupstra%C3%9Fe+52-54+51063+K%C3%B6ln" target="_blank" rel="noopener" data-t="route"></a>
        <a class="btn line" href="https://www.instagram.com/markaistanbuljuwelier/" target="_blank" rel="noopener">Instagram</a>
      </div>
    </div>
  </div></section>
</main>

<footer><div class="wrap">
  <img src="lockup.png" alt="Zen Diamond × Marka Istanbul">

const TAKI_KAT = ["kolye","kolyeucu","kupe","yuzuk","piercing","set"];
let TAKI = [], takiKat = "kolye", takiN = 12;
// ayar.json: {"sesera": true|false} – Sesera × Marka bölümünü açar / kapatır (kapalıyken genel "Altın takı" kartları görünür)
let AYAR = {sesera:true};
const loc = () => ({tr:"tr-TR",de:"de-DE",en:"en-GB"}[lang]);
const euro = v => Math.round(v).toLocaleString(loc()) + " €";
const euro2 = v => v.toLocaleString(loc(),{minimumFractionDigits:2,maximumFractionDigits:2}) + " €";
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const wa = () => ((cfg && cfg.whatsapp) || WA_YEDEK).replace(/\D/g,"");
const waUrl = msg => `https://wa.me/${wa()}?text=${encodeURIComponent(msg)}`;
const isAsk = id => id.startsWith("k-");
const nm = o => o[lang] || o.tr || o.id;

function temaUygula(ad){
  const m = /^#tema-([a-z]+)$/.exec(location.hash || ""); if (m && TEMALAR[m[1]]) ad = m[1];
  const T0 = TEMALAR[ad] || TEMALAR.beyaz, r = document.documentElement;
  r.classList.toggle("koyu", !!T0.koyu);
  ["band","tbg","tbg2","herobg"].forEach(k=>r.style.removeProperty("--"+k));
  if (T0.band) r.style.setProperty("--band", T0.band);
  if (T0.bg) r.style.setProperty("--tbg", T0.bg);
  if (T0.bg2) r.style.setProperty("--tbg2", T0.bg2);
  if (T0.hb) r.style.setProperty("--herobg", T0.hb);
  const k = $("kapak"); if (k && !k.src.endsWith(T0.kapak)) k.src = T0.kapak;
}
async function getJSON(url, ms=6000){ const c = new AbortController(); const tm = setTimeout(()=>c.abort(), ms);
  try{ const r = await fetch(url,{signal:c.signal,cache:"no-store"}); if(!r.ok) throw 0; return await r.json(); } finally{ clearTimeout(tm); } }
async function getText(url, ms=6000){ const c = new AbortController(); const tm = setTimeout(()=>c.abort(), ms);
  try{ const r = await fetch(url,{signal:c.signal,cache:"no-store"}); if(!r.ok) throw 0; return await r.text(); } finally{ clearTimeout(tm); } }
async function loadConfig(){
  try{ cfg = await getJSON(CEYREKMATIK + "config.json?v=" + Date.now()); ls.set("ms_cfg", JSON.stringify(cfg)); }
  catch(e){ try{ cfg = JSON.parse(ls.get("ms_cfg")); }catch(_){ } }
  if (!cfg || !cfg.products) cfg = CFG_YEDEK;
  try{ const u = await getJSON("urunler.json?v=" + Date.now(), 4000); if (Array.isArray(u)) extra = u; }catch(e){ extra = []; }
  try{ const a = await getJSON("ayar.json?v=" + Date.now(), 4000); if (a && typeof a === "object") AYAR = Object.assign({sesera:true}, a); }catch(e){}
  if (AYAR.sesera === false){ TAKI = []; } else
  try{ const k = await getJSON("takilar.json?v=" + Date.now(), 8000);
    if (Array.isArray(k)) TAKI = k.map(o=>({id:"s-"+o.i, sku:o.i, k:o.k, tr:o.n, foto:TAKI_CDN+o.f+"&width=600", fiyat:o.p})); }catch(e){ TAKI = []; }
}
async function fetchSpot(){
  if (cfg.manualSpot){ spotG = +cfg.manualSpot; src = "manual"; priceTime = new Date(); return renderPrices(); }
  try{ const f = (await getText("https://proxy.kitco.com/getPM?symbol=AU&currency=EUR")).trim().split(",");
    const bid = parseFloat(f[4]); if (!(bid > 1000)) throw 0; spotG = bid/OZ; src = "live"; priceTime = new Date();
  }catch(e0){ try{ const j = await getJSON("https://api.gold-api.com/price/XAU/EUR"); if (!j.price) throw 0;
    spotG = j.price/OZ; src = "live"; priceTime = new Date(j.updatedAt || Date.now());
  }catch(e1){ try{ const d = await getJSON(CEYREKMATIK + "price.json?v=" + Date.now()); if (!d.ozEur) throw 0;
    spotG = d.ozEur/OZ; src = "daily"; priceTime = new Date(d.updatedAt);
  }catch(e2){ let last = null; try{ last = JSON.parse(ls.get("ms_last")); }catch(_){}
    if (last && last.g){ spotG = last.g; priceTime = new Date(last.d); } else { spotG = (cfg.fallbackOzEur || CFG_YEDEK.fallbackOzEur)/OZ; priceTime = null; }
    src = "offline"; }}}
  if (src !== "offline") ls.set("ms_last", JSON.stringify({g:spotG, d:priceTime.toISOString()}));
  renderPrices();
}
// Çeyrekmatik ile aynı hesap: tüm fiyatlar aşağı yuvarlanır
function priceOf(p){
  if (p.baz){ const b = cfg.products.find(x=>x.id===p.baz); if (b && !b.baz) return priceOf(b) * (+p.kat||0); }
  return Math.floor(p.satisMilyem ? p.gram*(p.satisMilyem/1000)*spotG : p.gram*p.purity*spotG*(1+(p.satis||0)/100) + (+p.iscilik||0));
}
function perGram(b){ return Math.floor(b.satisMilyem ? (b.satisMilyem/1000)*spotG : b.purity*spotG*(1+(b.satis||0)/100) + (+b.iscilik||0)); }
const find = id => cfg.products.find(x=>x.id===id) || cfg.bracelets.find(x=>x.id===id) || extra.find(x=>x.id===id) || TAKI.find(x=>x.id===id);
const isBracelet = id => !!cfg.bracelets.find(x=>x.id===id);
function unitPrice(it){ const o = find(it.id); if (!o) return 0;
  if (isBracelet(it.id)) return perGram(o) * (+it.g||0); if (o.fiyat != null) return +o.fiyat; return priceOf(o); }
function imgOf(id){
  if (isAsk(id)){ const k = [...KOLEKSIYON, ...ALTINTAKI].find(x=>x.id===id); return k ? {src:k.foto, ph:true} : null; }
  const o = find(id); if (o && o.foto) return {src:o.foto, ph:true};
  const g = GORSEL[id]; return g ? {src:`urun-${g[0]}.webp`, w:g[1]} : null;
}
const gramTxt = g => String(g).replace(".", lang==="en" ? "." : ",") + " g";

function renderStatic(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent = t(el.dataset.t));
  document.querySelectorAll("[data-h]").forEach(el=>el.innerHTML = t(el.dataset.h));
  document.querySelectorAll("#lang button").forEach(b=>b.classList.toggle("on", b.dataset.l===lang));
  $("mosaic").innerHTML = KOLEKSIYON.map(k=>`<article class="tile ${k.cls||""}"${k.anchor?` id="${k.anchor}"`:""}>
    <div class="im"><img src="${k.foto}" alt="${esc(t(k.id))}" loading="lazy"></div>
    <h3>${esc(t(k.id))}</h3><p>${esc(t("d-"+k.id))}</p><button class="go" data-ask="${k.id}">${esc(t("ask"))}</button></article>`).join("")
    + extra.filter(x=>x.kat==="pirlanta"||x.kat==="alyans").map(o=>`<article class="tile">
    <div class="im"><img src="${esc(o.foto||"")}" alt="${esc(nm(o))}" loading="lazy"></div>
    <h3>${esc(nm(o))}</h3><p>${esc(o.aciklama||"")}${o.fiyat!=null?` ${euro(o.fiyat)}`:""}</p><button class="go" data-add="${esc(o.id)}">${esc(t("add"))}</button></article>`).join("");
  renderTaki();
  $("stL").innerHTML = ["s1","s2","s3"].map(k=>`<li>${esc(t(k))}<span>${esc(t(k+"d"))}</span></li>`).join("");
  $("promise").innerHTML = ["p1","p2","p3","p4"].map(k=>`<div><h3>${esc(t(k))}</h3><p>${esc(t(k+"d"))}</p></div>`).join("");
  $("fDeliv").innerHTML = TESLIM.map(d=>`<label><input type="radio" name="deliv" value="${d}"${d===deliv?" checked":""}>${esc(t("t_"+d))}</label>`).join("");
  $("fPay").innerHTML = ODEME.map(o=>o.aktif ? `<label><input type="radio" name="pay" value="${o.id}"${o.id===pay?" checked":""}>${esc(t("o_"+o.id))}</label>`
    : `<label class="dis"><input type="radio" disabled>${esc(t("o_"+o.id))} (${esc(t("soon"))})</label>`).join("");
  $("waShop").href = waUrl(t("hi")); $("waHero").href = waUrl(t("hiR"));
}
function renderTaki(){
  $("takiH").innerHTML = TAKI.length ? `Sesera Gold <span class="x">×</span> Marka Istanbul` : esc(t("takiH"));
  $("takiP").textContent = t(TAKI.length ? "seseraP" : "takiP0");
  if (!TAKI.length){
    $("taki4").className = "mosaic"; $("takiChips").innerHTML = ""; $("takiMore").innerHTML = "";
    $("taki4").innerHTML = ALTINTAKI.map(k=>`<article class="tile">
    <div class="im"><img src="${k.foto}" alt="${esc(t(k.id))}" loading="lazy"></div>
    <h3>${esc(t(k.id))}</h3><p>${esc(t("d-"+k.id))}</p><button class="go" data-ask="${k.id}">${esc(t("ask"))}</button></article>`).join("")
    + extra.filter(x=>x.kat==="taki").map(o=>`<article class="tile">
    <div class="im"><img src="${esc(o.foto||"")}" alt="${esc(nm(o))}" loading="lazy"></div>
    <h3>${esc(nm(o))}</h3><p>${esc(o.aciklama||"")}${o.fiyat!=null?` ${euro(o.fiyat)}`:""}</p><button class="go" data-add="${esc(o.id)}">${esc(t("add"))}</button></article>`).join("");
    return;
  }
  $("takiChips").innerHTML = TAKI_KAT.map(k=>`<button data-kat="${k}"${k===takiKat?' class="on"':''}>${esc(t("tk_"+k))}<small>${TAKI.filter(x=>x.k===k).length}</small></button>`).join("");
  const L = TAKI.filter(x=>x.k===takiKat);
  $("taki4").className = "pgrid";
  $("taki4").innerHTML = L.slice(0, takiN).map(o=>`<article class="pc"><div class="im"><img src="${esc(o.foto)}" alt="${esc(o.tr)}" loading="lazy"></div>
    <h3>${esc(o.tr)}</h3><div class="sku">${esc(o.sku)}</div><div class="pp">${euro(o.fiyat)}</div><button class="go" data-add="${esc(o.id)}">${esc(t("add"))}</button></article>`).join("");
  $("takiMore").innerHTML = L.length > takiN ? `<button class="btn" data-more="1">${esc(t("more"))} (${L.length - takiN})</button>` : "";
}
function rowHtml(p){ const im = imgOf(p.id);
  return `<div class="row"><div class="c">${im?`<img src="${im.src}" width="${im.w}" alt="">`:""}</div>
    <div class="nm">${esc(nm(p))}<small>${gramTxt(p.gram)}</small></div><div class="pr">${euro(priceOf(p))}</div>
    <button class="plus" data-add="${p.id}" aria-label="${esc(t("add"))}: ${esc(nm(p))}">+</button></div>`; }
function renderPrices(){
  $("spotLbl").textContent = t("spotLbl"); $("spotG").textContent = spotG ? euro2(spotG) : "—";
  let when = t(src);
  if (priceTime && !isNaN(priceTime)){ const today = priceTime.toDateString() === new Date().toDateString();
    when += ", " + (today ? priceTime.toLocaleTimeString(loc(),{hour:"2-digit",minute:"2-digit"}) : priceTime.toLocaleDateString(loc())); }
  $("spotWhen").textContent = when; $("dot").classList.toggle("off", src !== "live");
  $("lZ").innerHTML = cfg.products.filter(p=>(p.grup||1)===1).map(rowHtml).join("");
  $("lR").innerHTML = cfg.products.filter(p=>p.grup===2).map(rowHtml).join("");
  const keep = {}; document.querySelectorAll("[data-gram]").forEach(i=>keep[i.dataset.gram] = i.value);
  $("bilezik").innerHTML = cfg.bracelets.map(b=>{ const pg = perGram(b), g = +keep[b.id] || 10, im = imgOf(b.id);
    return `<div class="bcard"><div class="im">${im?`<img src="${im.src}" alt="${esc(nm(b))}">`:""}</div><div>
      <h3>${esc(nm(b))}</h3><div class="per">${esc(t("bzPer"))} ${euro(pg)}</div>
      <div class="calc"><input type="number" inputmode="decimal" min="1" step="0.5" value="${g}" data-gram="${b.id}" aria-label="${esc(t("gram"))}"><span>${esc(t("gram"))}</span><span class="sum" data-bp="${b.id}">${euro(pg*g)}</span></div>
      <button class="btn" data-add="${b.id}">${esc(t("add"))}</button></div></div>`; }).join("");
  renderCart();
}
function cartLines(){
  return cart.map(it=>{ if (isAsk(it.id)) return {it, ask:true, u:0, sum:0, label:t(it.id)};
    const o = find(it.id); if (!o) return null; const u = unitPrice(it);
    return {it, u, sum:u*it.q, label: nm(o) + (isBracelet(it.id) ? ` ${gramTxt(it.g)}` : "") + (o.sku ? ` (${o.sku})` : "")}; }).filter(Boolean);
}
function renderCart(){
  const L = cartLines(), asks = L.filter(l=>l.ask).length;
  $("cartN").textContent = L.reduce((a,l)=>a+l.it.q,0);
  $("form").style.display = L.length ? "" : "none";
  $("items").innerHTML = L.length ? L.map((l,i)=>{ const im = imgOf(l.it.id);
    return `<div class="ci"><div class="im">${im?`<img ${im.ph?'class="ph"':""} src="${esc(im.src)}" alt="">`:""}</div>
      <div><div class="n">${esc(l.label)}</div>${l.ask?"":`<div class="s">${euro(l.u)} / ${esc(t("piece"))}</div>`}
      <div class="qty"><button data-q="${i}" data-d="-1" aria-label="−">−</button><span>${l.it.q}</span><button data-q="${i}" data-d="1" aria-label="+">+</button></div></div>
      <div class="v${l.ask?" ask":""}">${l.ask?esc(t("askShort")):euro(l.sum)}</div></div>`; }).join("") : `<div class="empty">${esc(t("empty"))}</div>`;
  $("total").textContent = euro(L.reduce((a,l)=>a+l.sum,0));
  $("priceNote").textContent = (asks ? t("askNote")(asks) + " " : "") + t("priceNote");
  ls.set("ms_cart2", JSON.stringify(cart));
}
function toast(m){ const e = $("toast"); e.textContent = m; e.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(()=>e.classList.remove("on"), 1700); }
function openCart(on){ $("drawer").classList.toggle("on", on); $("ovl").classList.toggle("on", on); $("drawer").setAttribute("aria-hidden", on?"false":"true"); $("err").classList.remove("on"); }
function addToCart(id, ask){
  let g = null;
  if (!ask && isBracelet(id)){ const inp = document.querySelector(`[data-gram="${id}"]`); g = Math.max(1, +(inp && inp.value) || 10); }
  const ex = cart.find(c=>c.id===id && (c.g||null)===g);
  if (ex){ if (!ask) ex.q++; } else cart.push({id, q:1, g});
  renderCart(); toast(t(ask ? "asked" : "added"));
}
function orderMessage(){
  const L = cartLines(), name = $("fName").value.trim(), note = $("fNote").value.trim(), lines = [t("mHead"), ""];
  L.forEach(l=>lines.push(`• ${l.it.q} × ${l.label} — ${l.ask ? t("mAsk") : euro(l.sum)}`));
  if (L.some(l=>!l.ask)) lines.push("", `*${t("mTotal")}: ${euro(L.reduce((a,l)=>a+l.sum,0))}*`, `${t("mSpot")}: ${euro2(spotG)} / g (${t(src)})`);
  lines.push("", `${t("mName")}: ${name}`, `${t("mDeliv")}: ${t("t_"+deliv)}`, `${t("mPay")}: ${t("o_"+pay)}`);
  if (note) lines.push(`${t("mNote")}: ${note}`);
  return lines.join("\n");
}
document.addEventListener("click", e=>{
  const kt = e.target.closest("[data-kat]"); if (kt){ takiKat = kt.dataset.kat; takiN = 12; return renderTaki(); }
  if (e.target.closest("[data-more]")){ takiN += 12; return renderTaki(); }
  const k = e.target.closest("[data-ask]"); if (k) return addToCart(k.dataset.ask, true);
  const a = e.target.closest("[data-add]"); if (a) return addToCart(a.dataset.add);
  const q = e.target.closest("[data-q]"); if (q){ const it = cart[+q.dataset.q]; if (it){ it.q += +q.dataset.d; if (it.q <= 0) cart.splice(+q.dataset.q,1); renderCart(); } return; }
  const l = e.target.closest("#lang button"); if (l){ lang = l.dataset.l; ls.set("ms_lang", lang); renderStatic(); renderPrices(); }
});
document.addEventListener("input", e=>{ const g = e.target.dataset && e.target.dataset.gram; if (!g) return;
  const b = find(g), el = document.querySelector(`[data-bp="${g}"]`); if (b && el) el.textContent = euro(perGram(b) * Math.max(0, +e.target.value||0)); });
document.addEventListener("change", e=>{ if (e.target.name === "deliv") deliv = e.target.value; if (e.target.name === "pay") pay = e.target.value; });
document.addEventListener("keydown", e=>{ if (e.key === "Escape") openCart(false); });
$("cartBtn").onclick = ()=>openCart(true); $("closeBtn").onclick = $("ovl").onclick = ()=>openCart(false);
$("sendBtn").onclick = ()=>{ const err = $("err");
  if (!cartLines().length){ err.textContent = t("needItem"); return err.classList.add("on"); }
  if (!$("fName").value.trim()){ err.textContent = t("needName"); err.classList.add("on"); return $("fName").focus(); }
  err.classList.remove("on");
  const a = document.createElement("a"); a.href = waUrl(orderMessage()); a.target = "_blank"; a.rel = "noopener"; document.body.appendChild(a); a.click(); a.remove(); };
window.addEventListener("hashchange", ()=>temaUygula(TEMA));
(async function(){
  temaUygula(TEMA); cfg = CFG_YEDEK; spotG = CFG_YEDEK.fallbackOzEur/OZ; renderStatic(); renderPrices();
  await loadConfig(); renderStatic(); await fetchSpot(); setInterval(fetchSpot, 60000);
})();
